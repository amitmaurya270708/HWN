<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Save the requested path to sessionStorage and redirect to index.html
      sessionStorage.setItem('redirect', window.location.pathname + window.location.search + window.location.hash);
      window.location.replace('/hwn/');  // Replace with your base path
    </script>
  </head>
  <body></body>
</html>
